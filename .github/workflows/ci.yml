name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Mínimo privilegio: el workflow sólo lee el código. Sin esto, el GITHUB_TOKEN
# hereda los permisos por defecto del repo, que pueden incluir escritura.
permissions:
  contents: read

# Las acciones van fijadas a un SHA de commit y no a la etiqueta @v4, que quien
# publica la acción puede mover. El comentario `# v4` al lado dice a qué
# etiqueta correspondía ese SHA cuando se fijó.

env:
  DATABASE_URL: "postgresql://user:pass@localhost:5432/eli"
  DIRECT_URL: "postgresql://user:pass@localhost:5432/eli"
  NEXTAUTH_URL: "http://localhost:3000"
  NEXTAUTH_SECRET: "ci-secret-not-used-for-anything-real"
  GOOGLE_CLIENT_ID: "ci-placeholder"
  GOOGLE_CLIENT_SECRET: "ci-placeholder"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Chequeo de tipos
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
