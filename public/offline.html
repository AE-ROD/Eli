<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fcfbf8" />
    <title>Sin conexión · Eli</title>
    <!--
      La muestra el service worker (public/sw.js) cuando se abre el panel sin
      internet. Es estática y no lleva datos de ningún negocio. Sin scripts: la
      CSP no los dejaría correr sin nonce, y no hacen falta (el botón es un
      enlace). Colores: crema, navy y texto-2 de app/globals.css.
    -->
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: #fcfbf8;
        color: #071a31;
        font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      main { max-width: 360px; }
      .marca {
        display: inline-grid;
        place-items: center;
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: #071a31;
        color: #ffffff;
        font-family: Georgia, serif;
        font-size: 28px;
        font-weight: 500;
      }
      h1 { margin: 24px 0 8px; font-size: 24px; font-weight: 500; letter-spacing: -0.5px; line-height: 1.25; }
      p { margin: 0; color: #5f6d77; font-size: 16px; line-height: 1.5; }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 24px;
        min-height: 48px;
        padding: 0 20px;
        border-radius: 16px;
        background: #071a31;
        color: #ffffff;
        font-weight: 500;
        text-decoration: none;
      }
      a:focus-visible { outline: 2px solid #071a31; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <span class="marca" aria-hidden="true">e</span>
      <h1>Sin conexión</h1>
      <p>Eli necesita internet para mostrarte tu agenda. Revisa el wifi o los datos y vuelve a intentar.</p>
      <a href="/dashboard">Volver a intentar</a>
    </main>
  </body>
</html>
