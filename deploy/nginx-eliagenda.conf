# nginx para Eli (eliagenda.com): PASO 1, el bloque de HTTP (puerto 80).
#
# Se instala en /etc/nginx/sites-available/eliagenda y se ACTIVA con un enlace
# en sites-enabled llamado "zz-eliagenda" (deploy/README.md, paso 9). El HTTPS lo
# agrega después `sudo certbot --nginx -d eliagenda.com -d www.eliagenda.com`,
# que reescribe ESTE archivo (cómo y qué revisar: README, paso 9.6). Si algún día
# prefieres no depender de cómo lo reescriba Certbot, el archivo con el HTTPS ya
# escrito a mano es deploy/nginx-eliagenda-https.conf (README, paso 9.8).
#
# ############################################################################
# ESTE VPS YA SIRVE sistemaone.com EN PRODUCCIÓN CON ESTE MISMO nginx.
# NUNCA `systemctl stop|restart|disable nginx`. Sólo:
#     sudo nginx -t && sudo systemctl reload nginx
# y nada de tocar /etc/nginx/sites-enabled/sistemaone. Este archivo no lo toca:
# agrega un sitio más, con sus propios server_name.
# ############################################################################
#
# Dominio canónico: el dominio SIN www (eliagenda.com). El www redirige ahí.
# Por qué: es la dirección de NEXTAUTH_URL, de los enlaces de los correos y de
# las URIs autorizadas de Google; con dos direcciones, las cookies de sesión y
# el login con Google quedarían partidos.
#
# ---------------------------------------------------------------------------
# SÓLO IPv4 (ningún "listen [::]..." en este archivo). Por qué: el límite de
# intentos cuenta por IP y $remote_addr es la dirección COMPLETA; en IPv6 cada
# persona recibe un bloque entero (/64) y podría usar otra dirección en cada
# pedido. Sin socket IPv6 para Eli no existe ese hueco. NO crees registros DNS
# AAAA para eliagenda.com.
#
# Qué pasa con un cliente IPv6 que fuerza el nombre (curl -6 --resolve
# eliagenda.com:443:[IPv6-del-VPS], o SNI eliagenda.com): sistemaone tiene
# "listen [::]:443 ssl ipv6only=on". nginx elige el server SÓLO entre los que
# escuchan en el socket que recibió la conexión, y Eli no está en [::]:443 ni en
# [::]:80. Esa conexión cae en el server de sistemaone (su certificado, su
# contenido; el navegador avisará que el certificado no es de eliagenda.com).
# No llega a Eli: no hay forma de que un pedido por IPv6 alcance el proxy.
# Lo comprueba README 9.7 con `curl -6`.
#
# NO uses "default_server" aquí (nginx lo permite una sola vez por puerto y ya
# hay quien lo tiene o lo hereda). Pero ojo con el ORDEN: el primer server que
# nginx lee para 0.0.0.0:80 / 0.0.0.0:443 es el servidor POR DEFECTO de ese
# puerto (el que contesta a nombres desconocidos, a la IP pelada y a escáneres).
# "eliagenda" ordena ANTES que "sistemaone", y Eli no puede ser el
# predeterminado. Por eso el enlace en sites-enabled se llama "zz-eliagenda":
# nginx lee los archivos en orden alfabético y sistemaone queda primero.
# ---------------------------------------------------------------------------
#
# Herencia de nginx (las dos trampas de este archivo):
#  1. add_header: lo definido en un "location" ANULA los add_header del
#     "server". Por eso los add_header están SÓLO a nivel server y ningún
#     location define los suyos (hay una prueba: deploy/deploy.test.ts). "always"
#     hace que salgan también en 404/301.
#  2. proxy_set_header: igual; basta UNO en un nivel para que se pierdan los
#     heredados de arriba. Por eso están TODOS juntos en "location /".
#
# Las otras cabeceras de seguridad (CSP, X-Frame-Options, nosniff, etc.) las
# manda la propia app (next.config.mjs); acá sólo va HSTS, que Vercel agregaba
# solo y la app no manda.

# ---------------------------------------------------------------------------
# www -> dominio sin www
#
# El redirect va DENTRO de "location /", no a nivel server: así, mientras Certbot
# valida el dominio por HTTP, el "location = /.well-known/acme-challenge/..." que
# inserta gana (un "return" a nivel server se ejecuta antes que cualquier
# location y se comería el desafío de www.eliagenda.com).
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name www.eliagenda.com;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        return 301 https://eliagenda.com$request_uri;
    }
}

# ---------------------------------------------------------------------------
# eliagenda.com -> Eli (Next.js en 127.0.0.1:3000)
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name eliagenda.com;

    # No anunciar la versión de nginx ("Server: nginx" a secas; quitarlo del
    # todo necesita un módulo que Ubuntu no trae).
    server_tokens off;

    # El código de la app limita los cuerpos a 5 MB (lib/cuerpo-del-pedido.ts);
    # esto corta antes, en la puerta, lo que ya sería rechazado (413).
    client_max_body_size 6m;

    # HSTS: el HTTPS lo termina nginx; Vercel agregaba esta cabecera solo y la
    # app no la manda. Un año, sin includeSubDomains (sólo cuenta por HTTPS: el
    # navegador la ignora si llega por HTTP). SÓLO acá arriba, nunca en un
    # location (ver "Herencia", punto 1).
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Compresión (el HTML ya se comprime siempre; esto agrega JSON, JS, CSS...).
    # Next comprime por su cuenta y nginx no recomprime lo ya comprimido.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript text/javascript application/xml application/rss+xml image/svg+xml;

    # Los crons los llama el propio servidor directo a 127.0.0.1:3000 (sin pasar
    # por acá), así que desde internet /api/cron y /api/cron/* no tienen por qué
    # existir. Cierra esa superficie aunque el secreto es la defensa de fondo.
    #
    # "~*" = expresión regular SIN distinguir mayúsculas (/API/CRON/x también).
    # Las regex se evalúan antes que "location /", así que gana ésta. nginx
    # compara contra la URI NORMALIZADA: ya decodificada (%2f -> /, %63 -> c),
    # sin dobles barras (merge_slashes, por defecto activo: //api//cron -> /api/cron)
    # y sin puntos (/api/x/../cron -> /api/cron). Es decir, esas variantes también
    # dan 404. Lo que NO se puede asegurar desde acá: que Next normalice igual
    # que nginx en casos raros (p. ej. \ o ;). Por eso el secreto de los crons
    # sigue siendo la defensa de fondo y 12.4b prueba las variantes en vivo.
    # Sin add_header propio: hereda HSTS del server.
    location ~* ^/api/cron(/|$) {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # -------------------------------------------------------------------
        # LO CRÍTICO: LA IP DEL CLIENTE QUE USA EL RATE LIMIT
        #
        # lib/rate-limit.ts (obtenerIp) lee la IP en este orden y se queda con
        # la primera que encuentra:
        #     1) x-vercel-forwarded-for   2) x-real-ip   3) x-forwarded-for
        # Eso era seguro en Vercel, que fija esas cabeceras él mismo. Aquí el
        # único que las fija es ESTE archivo. Si un atacante manda
        # "X-Vercel-Forwarded-For: 1.2.3.4" y nginx lo deja pasar, la app lo
        # cree, y el atacante cambia de IP en cada pedido: el límite de
        # intentos de login (10 por minuto) deja de existir.
        #
        # Por eso, de las tres cabeceras:
        #   - x-vercel-forwarded-for: valor VACÍO. La documentación de nginx
        #     dice que un proxy_set_header con valor vacío NO pasa esa cabecera
        #     al servidor de arriba, y también descarta la que mandó el cliente
        #     (cualquier mayúscula/minúscula, repetida). Lo comprueba
        #     deploy/probar-cabeceras.sh con un nginx real.
        #   - x-real-ip y x-forwarded-for: se FIJAN con $remote_addr, la IP de
        #     la conexión TCP real, pisando lo que haya mandado el cliente.
        #     NUNCA "$proxy_add_x_forwarded_for": ése SUMA a la cabecera que
        #     trajo el cliente (ahí está el ataque).
        #
        # $remote_addr es la IP real mientras nadie configure el módulo realip
        # (set_real_ip_from / real_ip_header) ni PROXY protocol en este nginx:
        # entonces nginx se la creería al cliente. No se debe agregar salvo que
        # algún día haya otro proxy (p. ej. Cloudflare) DELANTE de nginx; en ese
        # caso hay que rehacer esta sección completa. README 9.2 trae la
        # comprobación (`nginx -T | grep real_ip`).
        #
        # Si este bloque se quita o se cambia, hay que revisar obtenerIp.
        # Hay una prueba (deploy/deploy.test.ts) que falla si desaparece.
        # -------------------------------------------------------------------
        proxy_set_header X-Vercel-Forwarded-For "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Reemplaza lo que el cliente haya mandado (Next lo usa al armar direcciones).
        proxy_set_header X-Forwarded-Host $host;

        # Otras cabeceras de "IP del cliente" que obtenerIp NO lee hoy: se
        # vacían también, por si algún día el código las empieza a leer.
        proxy_set_header Forwarded "";
        proxy_set_header True-Client-IP "";
        proxy_set_header CF-Connecting-IP "";
    }
}
